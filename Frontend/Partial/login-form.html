<!-- ===== PARTIAL: Sign in form (used inside login-modal.html) ===== -->
<p class="auth-reason" data-auth-reason hidden></p>
<h2 class="auth-title" id="authTitle-login">Sign in</h2>
<p class="auth-sub">Welcome back! Sign in to buy, sell and swap books.</p>

<form class="auth-form" id="loginForm" novalidate>
  <div class="auth-alert" role="alert" hidden></div>

  <div class="auth-field">
    <label for="loginEmail">Email</label>
    <div class="auth-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" aria-describedby="loginEmail-err">
    </div>
    <p class="auth-error" id="loginEmail-err"></p>
  </div>

  <div class="auth-field">
    <label for="loginPassword">Password</label>
    <div class="auth-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Your password" aria-describedby="loginPassword-err">
      <button type="button" class="auth-eye" data-auth-eye aria-label="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p class="auth-error" id="loginPassword-err"></p>
  </div>

  <div class="auth-row">
    <label class="auth-check">
      <input type="checkbox" name="remember" checked>
      <span>Keep me signed in</span>
    </label>
    <button type="button" class="auth-link" data-auth-forgot>Forgot password?</button>
  </div>

  <button type="submit" class="auth-btn auth-btn-primary auth-btn-block">Sign in</button>
</form>

<div class="auth-divider"><span>New to BookSwap?</span></div>

<button type="button" class="auth-btn auth-btn-outline auth-btn-block" data-auth-go="role">Create your BookSwap account</button>
<p class="auth-note">It's free and takes less than a minute.</p>
