<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookSwap - Book Details</title>
  <link rel="stylesheet" href="CSS/global.css">
</head>
<body>

  <!-- Reusable Navigation -->
  <div data-include="nav"></div>

  <main class="bd-page">
    <div class="bd-wrap" id="bdWrap">
      <div style="text-align: center; padding: 60px 20px;">
        <p>Loading book details...</p>
      </div>
    </div>
  </main>

  <!-- In-app chat panel (opened by the chat buttons on this page) -->
  <aside class="bd-chat" id="bdChat" aria-hidden="true" aria-label="Chat with seller">
    <div class="bd-chat-head">
      <span class="bd-chat-avatar"></span>
      <span class="bd-chat-who">
        <span class="bd-chat-name" id="bdChatName">Seller</span>
        <span class="bd-chat-book" id="bdChatBook"></span>
      </span>
      <button class="bd-chat-close" id="bdChatClose" type="button" aria-label="Close chat">&times;</button>
    </div>
    <div class="bd-chat-messages" id="bdChatMessages"></div>
    <form class="bd-chat-form" id="bdChatForm" autocomplete="off">
      <input class="bd-chat-input" id="bdChatInput" type="text" placeholder="Type a message..." aria-label="Type a message" maxlength="500">
      <button class="bd-chat-send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </aside>

  <!-- Reusable Footer -->
  <div data-include="footer"></div>

  <!-- Scripts -->
  <script src="JS/include.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/book-details.js"></script>
</body>
</html>
