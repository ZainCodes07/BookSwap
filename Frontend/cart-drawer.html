<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookSwap - Your Cart</title>
  <link rel="stylesheet" href="CSS/global.css">
</head>
<body>

  <!-- Navigation -->
  <div data-include="nav"></div>

  <main class="co-page">
    <div class="co-empty">
      <p>Looking for more books?</p>
      <a href="category.html">Browse categories</a>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <aside class="cart-drawer" id="cartDrawer" aria-labelledby="cartTitle">
    <div class="cart-head">
      <h2 id="cartTitle">Your Cart <span class="cart-head-count" id="cartHeadCount">0</span></h2>
      <button class="cart-close" id="cartClose" type="button" aria-label="Close cart">&times;</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-foot">
      <div class="cart-subtotal"><span>Subtotal</span><strong id="cartSubtotal">Rs. 0</strong></div>
      <a class="cart-btn cart-btn-primary" id="cartCheckout" href="checkout.html">Proceed to Checkout</a>
      <a class="cart-btn cart-btn-ghost" href="category.html">Continue Browsing</a>
    </div>
  </aside>

  <!-- Footer -->
  <div data-include="footer"></div>

  <script src="js/include.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/cart.js"></script>
</body>
</html>
