<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookSwap - Messages</title>
  <link rel="stylesheet" href="CSS/global.css">
</head>
<body>

  <!-- Navigation -->
  <div data-include="nav"></div>

  <main class="chat-page">
    <div class="chat-shell" id="chatShell">

      <aside class="chat-list" aria-label="Conversations">
        <div class="chat-list-head">Messages</div>
        <div class="chat-list-items" id="chatList"></div>
      </aside>

      <section class="chat-thread" id="chatThread" aria-label="Conversation"></section>

    </div>
  </main>

  <!-- Footer -->
  <div data-include="footer"></div>

  <script src="js/include.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/chat.js"></script>
</body>
</html>
