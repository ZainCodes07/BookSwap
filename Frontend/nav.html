<!-- ===== NAVIGATION COMPONENT ===== -->
<header class="site-nav" id="siteNav">
  <div class="nav-container">

    <!-- Logo -->
    <a href="{{ROOT}}index.html" class="nav-logo" aria-label="BookSwap Home">
      <img src="{{ROOT}}Images/logo.png" alt="BookSwap logo" class="nav-logo-img" width="52" height="52">
      <span class="nav-logo-text">
        <span class="nav-logo-name">Book<span>Swap</span></span>
        <span class="nav-tagline">Read &bull; Swap &bull; Grow</span>
      </span>
    </a>

    <!-- Mobile menu button -->
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Links -->
    <ul class="nav-links">
      <li><a href="{{ROOT}}index.html">Home</a></li>
      <li><a href="{{ROOT}}category.html">Categories</a></li>
      <li><a href="{{ROOT}}about.html">About</a></li>
      <li><a href="{{ROOT}}contact.html">Contact</a></li>
    </ul>

    <!-- Search -->
    <form class="nav-search" id="navSearchForm" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="navSearchInput" placeholder="Search books, authors..." aria-label="Search books or authors">
    </form>

    <!-- Actions: Search -> Sign In / Profile Avatar -> Cart at end -->
    <div class="nav-actions">
      <!-- 1. Sign in / Login button for guest -->
      <button type="button" class="nav-signin-btn" id="navSignInBtn" data-auth-open="login">
        Sign in / Login
      </button>

      <!-- 2. Circle Profile avatar (replaces Sign In when logged in) -->
      <div class="nav-user-menu-wrap" id="navUserMenuWrap" style="display: none;">
        <a href="{{ROOT}}profile.html" class="nav-avatar is-signed-in" id="navProfileBtn" aria-label="My Profile">
          <span class="auth-initial" id="navUserInitial">U</span>
        </a>
      </div>

      <!-- Notification Bell Dropdown -->
      <div class="nav-notif-wrap" id="navNotifWrap" style="display: none;">
        <button type="button" class="nav-icon-btn nav-notif-btn" id="navNotifBtn" aria-label="Notifications" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="nav-badge" id="navNotifBadge" style="display: none;">0</span>
        </button>
        <div class="nav-notif-dropdown" id="navNotifDropdown" style="display: none;">
          <div class="nav-notif-header">
            <h4>Notifications</h4>
            <span class="nav-notif-mark-read" id="navNotifClear">Mark all read</span>
          </div>
          <div class="nav-notif-list" id="navNotifList">
            <div class="nav-notif-empty">No new notifications</div>
          </div>
          <div class="nav-notif-footer">
            <a href="{{ROOT}}chat.html" class="nav-notif-view-all">Open Messages &amp; Chat &rarr;</a>
          </div>
        </div>
      </div>

      <!-- 3. Cart Circle Button at the end -->
      <a href="{{ROOT}}cart-drawer.html" class="nav-icon-btn nav-cart" id="cartBtn" aria-label="Cart">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="nav-badge" id="cartCount">0</span>
      </a>
    </div>
  </div>

  <!-- Wave under navbar -->
  <svg class="nav-wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0H1440V12C1250 38 1000 6 720 22C440 38 220 30 0 8Z"/>
  </svg>
</header>
