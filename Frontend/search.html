<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" href="Images/logo.png">
  <title>BookSwap - Search</title>
  <link rel="stylesheet" href="CSS/global.css">
</head>
<body>

  <!-- Navigation -->
  <div data-include="nav"></div>

  <main class="srch-page">

    <div class="srch-bg" aria-hidden="true">
      <svg viewBox="0 0 64 48"><path d="M2 6c8-4 20-4 28 0v36c-8-4-20-4-28 0z"/><path d="M62 6c-8-4-20-4-28 0v36c8-4 20-4 28 0z"/></svg>
      <svg viewBox="0 0 48 48"><path d="M16 12L4 24l12 12M32 12l12 12-12 12"/></svg>
    </div>

    <div class="srch-bar-wrap">
      <div class="srch-bar">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="srchInput" placeholder="Search by title, author or subject..." aria-label="Search by title or subject" autocomplete="off">
      </div>
    </div>

    <div class="srch-info">
      <p id="srchCount">Loading...</p>
      <p id="srchNote" class="srch-note" hidden></p>
    </div>

    <div class="srch-grid" id="srchGrid"></div>

    <p class="srch-empty" id="srchEmpty" hidden>No books match your search.</p>

  </main>

  <!-- Footer -->
  <div data-include="footer"></div>

  <script src="JS/include.js"></script>
  <script src="JS/api.js"></script>
  <script src="JS/auth.js"></script>
  <script src="JS/search.js"></script>
</body>
</html>
